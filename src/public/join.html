<!DOCTYPE html>
<html>
    <head>
        <title>Join | EduHoot</title>
        <link rel = "stylesheet" href = "css/index.css">
        <link href="/css/fonts.css" rel="stylesheet">
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
        <meta name="theme-color" content="#6c2bd9">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="lang-switcher">
            <button type="button" data-lang="es" onclick="window.i18nPlayer && window.i18nPlayer.setLang('es')">ES</button>
            <button type="button" data-lang="ca" onclick="window.i18nPlayer && window.i18nPlayer.setLang('ca')">CA</button>
            <button type="button" data-lang="en" onclick="window.i18nPlayer && window.i18nPlayer.setLang('en')">EN</button>
        </div>
        <div id="pinModal" class="pin-modal" role="dialog" aria-modal="true">
            <div class="pin-modal__card">
                <h2 data-i18n="join_pin_prompt">Ingresa el PIN del juego</h2>
                <p data-i18n="join_pin_blocked">Necesitas un PIN válido para continuar.</p>
                <form id="pinModalForm" class="pin-modal__form">
                    <label for="pinModalInput" data-i18n="join_pin">PIN de la partida</label>
                    <div class="pin-modal__controls">
                        <input id="pinModalInput" type="number" inputmode="numeric" placeholder="12345" autofocus>
                    </div>
                    <button id="pinModalSubmit" class="pin-modal__submit" type="submit" data-i18n="join_continue">Continuar</button>
                    <p id="pinModalError" class="pin-modal__error" aria-live="assertive"></p>
                </form>
            </div>
        </div>
        <img id="join-logo" src="/icons/logo.svg" alt="EduHoot logo">
        <h1 id="title">EduHoot</h1>
        <div id="pin-display" class="pin-display hidden">
            <span class="pin-display__label">PIN</span>
            <span id="pin-display-value" class="pin-display__value"></span>
        </div>
        <form action="/player/">
                <input type="hidden" id="pin" name="pin"/>
                <div class="form-field">
                    <label id="label" data-i18n="join_icon">Icono</label>
                    <input type="hidden" id="icon" name="icon">
                    <div id="icon-picker">
                        <button type="button" data-icon="🦊">🦊</button>
                        <button type="button" data-icon="🐱">🐱</button>
                        <button type="button" data-icon="🐶">🐶</button>
                        <button type="button" data-icon="🐼">🐼</button>
                        <button type="button" data-icon="🐧">🐧</button>
                        <button type="button" data-icon="🐸">🐸</button>
                        <button type="button" data-icon="🦉">🦉</button>
                        <button type="button" data-icon="🦄">🦄</button>
                        <button type="button" data-icon="🐰">🐰</button>
                        <button type="button" data-icon="🐢">🐢</button>
                        <button type="button" data-icon="🐙">🐙</button>
                        <button type="button" data-icon="🦁">🦁</button>
                        <button type="button" data-icon="🐨">🐨</button>
                        <button type="button" data-icon="🐝">🐝</button>
                        <button type="button" data-icon="🐯">🐯</button>
                        <button type="button" data-icon="🐸">🐸</button>
                        <button type="button" data-icon="🐻">🐻</button>
                        <button type="button" data-icon="🦕">🦕</button>
                        <button type="button" data-icon="🦖">🦖</button>
                        <button type="button" data-icon="🐉">🐉</button>
                        <button type="button" data-icon="🚀">🚀</button>
                        <button type="button" data-icon="🌈">🌈</button>
                        <button type="button" data-icon="⚽️">⚽️</button>
                        <button type="button" data-icon="🏀">🏀</button>
                        <button type="button" data-icon="🏆">🏆</button>
                        <button type="button" data-icon="🎮">🎮</button>
                        <button type="button" data-icon="🎧">🎧</button>
                        <button type="button" data-icon="📚">📚</button>
                        <button type="button" data-icon="🎨">🎨</button>
                    </div>
                    <div id="icon-preview"></div>
                </div>
                <div class="form-field">
                    <label id = "label" data-i18n="join_name">Display Name</label>
                    <input id = "name" class="name-three" type = "text" name="name" autocomplete="name" maxlength="3" pattern="[A-Za-z0-9]{1,3}" />
                </div>
                <div id="student-auth-fields" class="student-auth hidden">
                    <div class="form-field">
                        <label id="label" for="student-code" data-i18n="join_student_code">Codi EduTicTac</label>
                        <input id="student-code" class="name-three" type="text" autocomplete="username" maxlength="3" pattern="[A-Za-z0-9]{3}" />
                    </div>
                    <div class="form-field">
                        <label id="label" for="student-pin" data-i18n="join_student_pin">PIN personal</label>
                        <input id="student-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="6" pattern="[0-9]{4,6}" />
                    </div>
                    <p id="student-auth-status" class="student-auth__status" aria-live="assertive"></p>
                </div>
                <input type="hidden" id="studentJoinToken" name="studentJoinToken">
                <input type="hidden" id="token" name="token">
                <div class="form-field">
                    <button id = "joinButton" data-i18n="join_button" disabled>Join</button>
                </div>
        </form>
        <footer class="site-footer">
            <div class="site-footer__content">
                <a class="site-footer__link" href="https://edutictac.es" target="_blank" rel="noopener">
                    <img class="site-footer__logo" src="/icons/logoedutictac.jpeg" alt="EduTicTac">
                    <span>edutictac.es</span>
                </a>
                <a class="site-footer__link" href="https://edutictac.es/privacitat.html" target="_blank" rel="noopener" data-i18n="footerPrivacy">Privacidad</a>
                <a class="site-footer__link" href="https://git.edutictac.es/Edutictac/eduhoot" target="_blank" rel="noopener" data-i18n="footerSource">Codi font</a>
                <p class="site-footer__about" data-i18n="footerLicense">EduHoot · Licencia GNU Affero General Public License v3.0 (AGPL-3.0)</p>
                <p class="site-footer__about" id="sw-version" aria-live="polite"></p>
            </div>
        </footer>
        <script src="js/i18n-player.js"></script>
        <script src="js/join.js"></script>
        <script src="js/sw-version.js"></script>
    </body>
</html>
